<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{%block title%}WeatherWeb{%endblock%}</title>
  
  <link rel="stylesheet" href="{{ url_for('static', filename=css_file) }}">

</head>
<body>
  <div id="search_box">
    <form action="/"method="POST">
     <input type="text"name="city"placeholder="Search city">
    </form>
    <!--Flash massage-->
      {%with message = get_flashed_messages()%}
      {%if message%}
      {%for msg in message%}
      <p id="flash_msg"style="color: rgb(183, 3, 3);">{{msg}}</p>
      {%endfor%}
      {%endif%}
      {%endwith%}

    </div>

    <div id="content">
    {%block content%}

    {%endblock%}
    </div>
  
</body>
</html>
